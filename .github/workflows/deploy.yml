name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*' # 只有当推送以 v 开头的 tag（如 v1.0.0, v0.1）时触发

# 授予 GITHUB_TOKEN 部署到 GitHub Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许同一时间只有一个部署在进行
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # vite 默认打包出来的目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
